name: Validate and release Aurora Glass

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PHP syntax
        run: |
          php -l src/AuroraGlassPlugin.php
          php -l config/aurora-glass.php
      - name: Test theme selector contract and style isolation
        run: node --test tests/theme-switcher.test.mjs
      - name: Verify Aurora CSS with headless Chromium
        run: node --test tests/browser-css.test.mjs
      - name: Package and validate archives
        run: |
          python tools/package.py --repository BernyCampos/Aurora-Glass
          cd build
          sha256sum --check SHA256SUMS.txt
          unzip -t Aurora-Glass-0.5.1.zip
          unzip -t Aurora-Glass-0.5.1-source.zip
      - name: Upload candidate packages
        uses: actions/upload-artifact@v4
        with:
          name: aurora-glass-php-${{ matrix.php }}
          path: build/

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: aurora-glass-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build release files
        run: |
          python tools/package.py --repository BernyCampos/Aurora-Glass
          cd build && sha256sum --check SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v0.5.1"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving its artifacts unchanged."
            exit 0
          fi
          gh release create "$tag" \
            build/Aurora-Glass-0.5.1.zip \
            build/Aurora-Glass-0.5.1-source.zip \
            build/SHA256SUMS.txt \
            build/update.json \
            --target "$GITHUB_SHA" \
            --title "Aurora Glass v0.5.1" \
            --notes-file docs/RELEASE.md
